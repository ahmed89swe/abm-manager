<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ABM Manager — نظام الإدارة المالية للمدير والمندوبين والصناديق الشهرية">
  <meta name="theme-color" content="#0D9488">

  <!-- iOS & PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ABM Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ABM Manager | نظام الإدارة المالية</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #F3F6F8;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
      --primary: #0D9488;
      --secondary: #1E40AF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B1120;
        --surface: #131C2E;
        --border: #26344D;
        --text: #F8FAFC;
        --muted: #94A3B8;
        --primary: #2DD4BF;
        --secondary: #60A5FA;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #abm-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 9999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #abm-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .abm-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 40px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }
    .abm-logo {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 28px rgba(13, 148, 136, 0.26);
      margin-bottom: 18px;
    }
    .abm-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 6px;
    }
    .abm-sub {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 22px;
    }
    .abm-bar-track {
      width: 180px;
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .abm-bar-fill {
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      animation: abmSlide 1.3s ease-in-out infinite alternate;
    }
    @keyframes abmSlide {
      from { transform: translateX(0); }
      to { transform: translateX(-115%); }
    }
  </style>
</head>
<body>
  <div id="abm-splash" aria-label="Loading ABM Manager">
    <div class="abm-card">
      <div class="abm-logo">ABM</div>
      <h1 class="abm-title">ABM Manager</h1>
      <p class="abm-sub">جاري تحضير بوابة الإدارة المالية...</p>
      <div class="abm-bar-track"><div class="abm-bar-fill"></div></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('abm-splash');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
